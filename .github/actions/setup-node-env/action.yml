name: setup-node-env
description: 'Setup Node.js and PNPM'
inputs:
  project_path:
    description: Path to the project directory containing package.json
    required: true
  install:
    description: 'Whether to run `pnpm install`'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache-dependency-path: ${{ inputs.project_path }}/pnpm-lock.yaml
        node-version-file: ${{ inputs.project_path }}/.nvmrc
        registry-url: 'https://npm.pkg.github.com'
        scope: '@opetushallitus'
    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        working-directory: ${{ inputs.project_path }}
        install: ${{ inputs.install }}
        cache: true
