name: setup-node-env
description: 'Setup Node.js and PNPM'
inputs:
  project_path:
    description: Path to the project directory containing package.json
    required: true
runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup-npm-registry-auth
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: ${{ inputs.project_path }}/package.json
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: ${{ inputs.project_path }}/.nvmrc
        cache: 'pnpm'
        cache-dependency-path: ${{ inputs.project_path }}/pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      run: cd ${{inputs.project_path}} && pnpm install
